# BEGIN_KITTY_THEME
# Font
font_family Maple Mono NF

# Cursor
shell_integration no-cursor
cursor_shape beam

# Padding
window_padding_width 7
window_padding_height 10

# Scrollback
scrollback_lines 3000

# Font size
font_size 11
map ctrl+shift+plus change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0

# Background opacity
background_opacity 1

# COLORS - Glacier Theme
cursor               #0BCFFF
selection_background #E0F7FA
selection_foreground #003344
background           #0A1F2B
foreground           #D0F0FD
color0               #1A2B3C
color8               #7FDBFF
color1               #FF6B6B
color9               #FF6B6B
color2               #6BE3FF
color10              #6BE3FF
color3               #A0EFFF
color11              #A0EFFF
color4               #70CFFF
color12              #70CFFF
color5               #B0EFFF
color13              #B0EFFF
color6               #55D6FF
color14              #55D6FF
color7               #C0F0FF
color15              #E0F0FF
# END_KITTY_THEME
